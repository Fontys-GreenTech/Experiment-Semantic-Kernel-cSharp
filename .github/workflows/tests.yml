# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Set User Secret
      run: dotnet user-secrets set "Msk:ApiKey" "${{ secrets.GOOGLE_API_KEY }}" --project MskBenchmarks/MskBenchmarks.csproj
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet run --project MskBenchmarks/MskBenchmarks.csproj --no-build --verbosity normal --configuration Release '*'
